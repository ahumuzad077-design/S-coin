syntax = "proto3";
package scoin.scoin.v1;

import "amino/amino.proto";
import "gogoproto/gogo.proto";

option go_package = "scoin/x/scoin/types";

// Params defines the parameters for the module.
message Params {
  option (amino.name) = "scoin/x/scoin/Params";
  option (gogoproto.equal) = true;
  
}