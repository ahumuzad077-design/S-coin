syntax = "proto3";
package scoin.scoin.v1;

import "amino/amino.proto";
import "gogoproto/gogo.proto";
import "scoin/scoin/v1/params.proto";

option go_package = "scoin/x/scoin/types";

// GenesisState defines the scoin module's genesis state.
message GenesisState {
  // params defines all the parameters of the module.
  Params params = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}
