name: Sentinel service checks

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "integrations/sentinel/**"
      - ".github/workflows/sentinel.yml"

permissions:
  contents: read

jobs:
  sentinel:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/sentinel
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: integrations/sentinel/requirements.txt
      - name: Install service dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q .
      - name: Test API access controls and live-trading guards
        run: python -m unittest discover -s . -p "test_*.py"
