name: Tidy Go module graph

on:
  pull_request:
    paths:
      - "go.mod"
      - "go.sum"
      - ".github/workflows/go-mod-tidy-sync.yml"

permissions:
  contents: read

jobs:
  tidy-and-commit:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/scoin-wallet-markets'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"
          check-latest: true

      - name: Tidy Go module graph
        run: go mod tidy

      - name: Commit tidy dependency graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add go.mod go.sum
          if ! git diff --cached --quiet; then
            git commit -m "chore(go): tidy dependency graph after security updates"
            git push origin HEAD:${GITHUB_HEAD_REF}
          fi
