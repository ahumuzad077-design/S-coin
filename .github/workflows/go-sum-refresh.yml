name: Resolve Go dependency checksums

on:
  pull_request:
    paths:
      - "go.mod"
      - ".github/workflows/go-sum-refresh.yml"
  push:
    branches:
      - feat/scoin-wallet-markets
    paths:
      - "go.mod"
      - "go.sum"
      - ".github/workflows/go-sum-refresh.yml"

permissions:
  contents: read

jobs:
  resolve-checksums:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"
          check-latest: true

      - name: Resolve upgraded dependency checksums
        run: |
          go mod download github.com/ethereum/go-ethereum
          go mod download github.com/hashicorp/go-getter
          go mod download github.com/ulikunitz/xz

  commit-go-checksums:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/feat/scoin-wallet-markets') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/scoin-wallet-markets')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"
          check-latest: true

      - name: Resolve upgraded dependency checksums
        run: |
          go mod download github.com/ethereum/go-ethereum
          go mod download github.com/hashicorp/go-getter
          go mod download github.com/ulikunitz/xz

      - name: Commit generated checksums
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add go.sum
          if ! git diff --cached --quiet; then
            git commit -m "chore(go): update dependency checksums"
            git push origin HEAD:${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}
          fi
