name: Build and publish S Coin binaries

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Prepare release variables
        id: vars
        shell: bash
        run: |
          set -euo pipefail
          repo_name="${GITHUB_REPOSITORY##*/}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag_name="${GITHUB_REF_NAME}"
            is_latest=false
            prerelease=true
          else
            tag_name="latest"
            is_latest=true
            prerelease=true
          fi
          echo "tag_name=${tag_name}" >> "${GITHUB_OUTPUT}"
          echo "tarball_prefix=${repo_name}-${tag_name}" >> "${GITHUB_OUTPUT}"
          echo "is_latest=${is_latest}" >> "${GITHUB_OUTPUT}"
          echo "prerelease=${prerelease}" >> "${GITHUB_OUTPUT}"

      - name: Build Linux and macOS binaries
        env:
          GOFLAGS: "-buildvcs=false"
          VERSION: ${{ steps.vars.outputs.tag_name }}
          COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release build
          ldflags="-X github.com/cosmos/cosmos-sdk/version.Name=scoin -X github.com/cosmos/cosmos-sdk/version.AppName=scoind -X github.com/cosmos/cosmos-sdk/version.Version=${VERSION} -X github.com/cosmos/cosmos-sdk/version.Commit=${COMMIT}"

          for target in "linux/amd64" "darwin/amd64" "darwin/arm64"; do
            goos="${target%/*}"
            goarch="${target#*/}"
            build_dir="build/${goos}-${goarch}"
            mkdir -p "${build_dir}"

            echo "Building ${goos}/${goarch}"
            GOOS="${goos}" GOARCH="${goarch}" CGO_ENABLED=0 \
              go build -mod=readonly -trimpath -ldflags "${ldflags}" \
              -o "${build_dir}/scoind" ./cmd/scoind

            archive="${{ steps.vars.outputs.tarball_prefix }}-${goos}-${goarch}.tar.gz"
            tar -C "${build_dir}" -czf "release/${archive}" scoind
          done

          (
            cd release
            sha256sum *.tar.gz > SHA256SUMS.txt
          )

      - name: Delete previous latest release
        if: ${{ steps.vars.outputs.is_latest == 'true' }}
        uses: dev-drprasad/delete-tag-and-release@v0.2.1
        with:
          tag_name: ${{ steps.vars.outputs.tag_name }}
          delete_release: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish prerelease
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.vars.outputs.tag_name }}
          files: release/*
          prerelease: ${{ steps.vars.outputs.prerelease }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
