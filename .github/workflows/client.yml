name: Client checks

on:
  pull_request:
    paths:
      - "client/**"
      - ".github/workflows/client.yml"
  push:
    branches:
      - feat/scoin-wallet-markets
    paths:
      - "client/package.json"
      - "client/package-lock.json"
      - ".github/workflows/client.yml"

permissions:
  contents: read

jobs:
  typecheck-and-web-export:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Update lockfile for the newly added SDK
        run: npm install --package-lock-only --ignore-scripts

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Export web application
        run: npx expo export --platform web --output-dir dist-web

  commit-client-lockfile:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/scoin-wallet-markets'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Generate npm lockfile
        working-directory: client
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(client): update npm lockfile"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
