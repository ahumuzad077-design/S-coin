name: Client checks

on:
  pull_request:
    paths:
      - "client/**"
      - ".github/workflows/client.yml"

permissions:
  contents: write

jobs:

  dependency-lockfile-tidy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull-request branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Regenerate Go module metadata
        run: go mod tidy

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Regenerate npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund --prefix client

      - name: Commit module metadata repair for this repository branch
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if git diff --quiet -- go.mod go.sum client/package-lock.json; then
            echo "Go and npm dependency metadata is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add go.mod go.sum client/package-lock.json
          git commit -m "chore(deps): synchronize Go and npm lockfiles [skip ci]"
          git push origin "HEAD:${PR_HEAD_REF}"

  typecheck-and-web-export:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Check out pull-request branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Test EVM transfer validation and wallet calls
        run: npm run test:wallet

      - name: Test Binance Spot Testnet API signing and orders
        run: npm run test:binance

      - name: Test EVM quote binding and response validation
        run: npm run test:swap

      - name: Test native S Coin transfer parsing
        run: npm run test:cosmos

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Export web application
        run: npx expo export --platform web --output-dir dist-web

      - name: Bundle Android native application
        run: npx expo export --platform android --output-dir dist-android

      - name: Bundle iOS native application
        run: npx expo export --platform ios --output-dir dist-ios
