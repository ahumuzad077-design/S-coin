name: Client checks

on:
  pull_request:
    paths:
      - "client/**"
      - ".github/workflows/client.yml"

permissions:
  contents: write

jobs:
  typecheck-and-web-export:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Check out pull-request branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Regenerate lockfile from declared dependencies
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit lockfile repair for same-repository branches
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(client): synchronize npm lockfile [skip ci]"
          git push origin "HEAD:${PR_HEAD_REF}"

      - name: Install from synchronized lockfile
        run: npm ci

      - name: Test EVM transfer validation and wallet calls
        run: npm run test:wallet

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Export web application
        run: npx expo export --platform web --output-dir dist-web

      - name: Bundle Android native application
        run: npx expo export --platform android --output-dir dist-android

      - name: Bundle iOS native application
        run: npx expo export --platform ios --output-dir dist-ios
