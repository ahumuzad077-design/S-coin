<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sentinel</title>
<style>
:root{--bg:#0e1117;--panel:#161b22;--border:#2a3142;--text:#e6edf3;
--dim:#8b949e;--green:#3fb950;--red:#f85149;--yellow:#d29922;--blue:#58a6ff}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:13px 'Segoe UI',system-ui,sans-serif;padding:14px;min-height:100vh}
.authbar{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-bottom:12px;flex-wrap:wrap}
.authbar input{width:min(340px,60vw);padding:8px 10px;background:#0e1117;border:1px solid var(--border);color:var(--text);border-radius:4px}
.authbar button{padding:8px 12px;border:0;border-radius:4px;background:var(--blue);color:#08130a;font-weight:700;cursor:pointer}
.authbar .status{color:var(--dim);font-size:11px}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.title{font-size:18px;font-weight:600}
.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;margin-top:4px}
.badge.paper{background:#1e3a5f;color:var(--blue)}
.badge.live{background:#5c1a1a;color:var(--red)}
.btn{padding:7px 14px;border:none;border-radius:4px;font-weight:600;cursor:pointer;font-size:12px}
.btn.start{background:var(--green);color:#08130a}
.btn.stop{background:var(--red);color:#160606}
.btn:disabled{opacity:.4;cursor:not-allowed}
.metrics{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:12px}
.card{background:var(--panel);padding:10px 12px;border-radius:6px}
.card .lbl{color:var(--dim);font-size:10px;letter-spacing:.5px;text-transform:uppercase}
.card .val{font:600 15px 'Consolas',monospace;margin-top:2px}
.main{display:grid;grid-template-columns:320px 1fr 420px;gap:10px;min-height:calc(100vh - 200px)}
.panel{background:var(--panel);border-radius:6px;padding:12px;display:flex;flex-direction:column;overflow:hidden}
.panel h3{font-size:12px;font-weight:600;margin-bottom:8px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;color:var(--dim);font-size:10px;padding:3px 4px;text-transform:uppercase}
td{padding:5px 4px;border-top:1px solid var(--border)}
.pl-pos{color:var(--green)}.pl-neg{color:var(--red)}
canvas{width:100%;display:block;background:var(--panel);border-radius:4px}
#candle{height:420px}
#equity{height:100px;margin-top:10px}
.trade-info{font:11px 'Consolas',monospace;margin-top:8px;color:var(--dim);padding:6px 0}
.tabs{display:flex;gap:4px;margin-bottom:8px}
.tab{padding:6px 14px;border:none;background:transparent;color:var(--dim);cursor:pointer;font-size:12px;font-weight:600;border-radius:4px}
.tab.active{background:#1c2230;color:var(--text)}
.log,.chat{overflow-y:auto;font:11px 'Consolas',monospace;flex:1;padding-right:4px;max-height:calc(100vh - 340px)}
.log div{padding:2px 0;word-break:break-word}
.log .time,.chat .time{color:var(--dim);margin-right:4px;font-size:10px}
.log .trade{color:var(--green)}
.log .warn{color:var(--yellow)}
.log .error{color:var(--red)}
.chat{font-family:'Segoe UI',sans-serif;font-size:12px;display:flex;flex-direction:column;gap:8px;min-height:200px}
.chat .msg{padding:10px 12px;border-radius:6px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
.chat .msg.user{background:#1e3a5f;color:#cfe3ff;align-self:flex-end;max-width:85%}
.chat .msg.bot{background:#1c2230;color:var(--text);align-self:flex-start;max-width:92%}
.chat .msg.bot.proposal{background:#152b1a;border-left:3px solid var(--green)}
.chat .msg.bot.trade{background:#152b1a;border-left:3px solid var(--green);color:#a4f5b3;font-weight:600}
.chat .msg.bot.error{background:#2b1515;border-left:3px solid var(--red)}
.chat-input{display:flex;gap:6px;margin-top:10px}
.chat-input input{flex:1;padding:10px 12px;background:#0e1117;border:1px solid var(--border);color:var(--text);border-radius:4px;font-size:13px;font-family:'Segoe UI',sans-serif}
.chat-input input:focus{outline:none;border-color:var(--blue)}
.chat-input button{padding:10px 18px;background:var(--blue);color:#08130a;border:none;border-radius:4px;font-weight:600;cursor:pointer;font-size:13px}
.chat-input button:disabled{opacity:.5;cursor:not-allowed}
.halt{color:var(--red);font-weight:600;margin-top:8px;font-size:11px}
</style>
</head>
<body>

<div class="authbar">
  <input id="tokenInput" type="password" autocomplete="current-password" placeholder="Sentinel access token" aria-label="Sentinel access token" />
  <button onclick="connectSentinel()">Connect securely</button>
  <button onclick="disconnectSentinel()" style="background:#303844;color:var(--text)">Disconnect</button>
  <span class="status" id="authStatus">Not connected</span>
</div>

<div class="header">
  <div>
    <div class="title">Sentinel</div>
    <span id="modeBadge" class="badge paper">PAPER</span>
  </div>
  <div>
    <button id="startBtn" class="btn start" onclick="startEngine()">Start Auto</button>
    <button id="stopBtn" class="btn stop" onclick="stopEngine()" disabled>Stop</button>
  </div>
</div>

<div class="metrics">
  <div class="card"><div class="lbl">Equity</div><div class="val" id="mEquity">$0</div></div>
  <div class="card"><div class="lbl">Buying Power</div><div class="val" id="mBP">$0</div></div>
  <div class="card"><div class="lbl">Positions</div><div class="val" id="mPos">0</div></div>
  <div class="card"><div class="lbl">Unrealized P/L</div><div class="val" id="mPL">$0</div></div>
  <div class="card"><div class="lbl">Cycle</div><div class="val" id="mCycle">0</div></div>
  <div class="card"><div class="lbl">Mode</div><div class="val" id="mStatus">Chat</div></div>
</div>

<div class="main">
  <div class="panel">
    <h3>Open Positions</h3>
    <table>
      <thead><tr><th>Sym</th><th>Qty</th><th>Entry</th><th>Now</th><th>P/L</th></tr></thead>
      <tbody id="posBody"></tbody>
    </table>
    <div id="haltMsg" class="halt"></div>
  </div>

  <div class="panel">
    <h3>Live Chart - <span id="focusSym">-</span></h3>
    <canvas id="candle" width="720" height="420"></canvas>
    <div class="trade-info" id="tradeInfo">Ask Sentinel to analyze a symbol to load the chart</div>
    <canvas id="equity" width="720" height="100"></canvas>
  </div>

  <div class="panel">
    <div class="tabs">
      <button class="tab active" onclick="switchTab('chat')" id="tabChat">Chat</button>
      <button class="tab" onclick="switchTab('log')" id="tabLog">Activity Log</button>
    </div>
    <div class="chat" id="chatBox"></div>
    <div class="log" id="logBox" style="display:none"></div>
    <div class="chat-input">
      <input id="chatInput" type="text" placeholder="Ask: 'analyze AAPL', 'positions', 'cash'..."
             onkeydown="if(event.key==='Enter')sendChat()" />
      <button id="sendBtn" onclick="sendChat()">Send</button>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);

let sentinelConnected = false;

async function apiFetch(url, options = {}) {
  const headers = new Headers(options.headers || {});
  const response = await fetch(url, {...options, headers, credentials: "same-origin"});
  if (response.status === 401 || response.status === 503) {
    sentinelConnected = false;
    $("authStatus").textContent = response.status === 401
      ? "Session expired — reconnect"
      : "API access is not configured";
  }
  return response;
}

async function connectSentinel() {
  const token = $("tokenInput").value.trim();
  if (!token) {
    $("authStatus").textContent = "Enter your access token";
    return;
  }
  try {
    const response = await apiFetch("/api/session", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      credentials: "same-origin",
      body: JSON.stringify({token})
    });
    if (!response.ok) {
      $("authStatus").textContent = "Authentication failed (" + response.status + ")";
      return;
    }
    sentinelConnected = true;
    $("tokenInput").value = "";
    $("authStatus").textContent = "Connected · secure HttpOnly session";
    await tick();
  } catch (error) {
    $("authStatus").textContent = "Connection failed";
  }
}

async function disconnectSentinel() {
  try {
    await apiFetch("/api/session", {method: "DELETE", credentials: "same-origin"});
  } finally {
    sentinelConnected = false;
    $("authStatus").textContent = "Disconnected";
  }
}

const fmt$ = n => "$" + Number(n).toLocaleString(undefined,{maximumFractionDigits:2});
const fmtN = (n,d=4) => Number(n).toFixed(d);

let tab = 'chat';
function switchTab(t){
  tab = t;
  $('tabChat').className = 'tab' + (t==='chat' ? ' active' : '');
  $('tabLog').className = 'tab' + (t==='log' ? ' active' : '');
  $('chatBox').style.display = (t==='chat') ? 'flex' : 'none';
  $('logBox').style.display = (t==='log') ? 'block' : 'none';
  $('chatBox').className = (t==='chat') ? 'chat' : 'chat hidden';
}

async function startEngine(){
  await apiFetch("/api/start",{method:"POST"});
  $("startBtn").disabled = true;
  $("stopBtn").disabled = false;
}
async function stopEngine(){
  await apiFetch("/api/stop",{method:"POST"});
  $("startBtn").disabled = false;
  $("stopBtn").disabled = true;
}

async function sendChat(){
  const inp = $("chatInput");
  const msg = inp.value.trim();
  if(!msg) return;
  inp.value = "";
  $("sendBtn").disabled = true;
  appendChat("user", msg, "text");
  try {
    const r = await apiFetch("/api/chat", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({message: msg})
    });
    if (!r.ok) {
      appendChat("bot", "Server error " + r.status + ": " + (await r.text()).slice(0,200), "error");
    } else {
      const data = await r.json();
      appendChat("bot", data.reply || "(no response)", data.type || "text");
    }
  } catch(e) {
    appendChat("bot", "Network error: " + e, "error");
  }
  $("sendBtn").disabled = false;
  $("chatInput").focus();
}

function appendChat(role, text, type){
  const box = $("chatBox");
  const div = document.createElement("div");
  div.className = "msg " + role;
  if(type && type !== "text") div.className += " " + type;
  const time = new Date().toLocaleTimeString().slice(0,8);
  div.textContent = "[" + time + "] " + text;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

appendChat("bot", "Sentinel ready. Try: 'analyze AAPL', 'positions', 'cash'", "text");

let currentSym = null, bars = [], trade = null, equityCurve = [];
async function tick(){
  try {
    const d = await (await apiFetch("/api/state")).json();
    $("mEquity").textContent = fmt$(d.equity || 0);
    $("mBP").textContent = fmt$(d.buying_power || 0);
    $("mPos").textContent = (d.positions || []).length;
    const pl = (d.positions || []).reduce((a,p) => a + (p.unrealized_pl || 0), 0);
    const plEl = $("mPL");
    plEl.textContent = (pl >= 0 ? "+" : "") + fmt$(pl);
    plEl.style.color = pl >= 0 ? "var(--green)" : "var(--red)";
    $("mCycle").textContent = d.cycle || 0;
    $("mStatus").textContent = d.running ? "Auto" : "Chat";
    const b = $("modeBadge");
    b.textContent = d.mode || "PAPER";
    b.className = "badge " + (d.mode === "LIVE" ? "live" : "paper");
    $("posBody").innerHTML = (d.positions || []).map(p => {
      const v = p.unrealized_pl || 0;
      const cls = v >= 0 ? "pl-pos" : "pl-neg";
      return "<tr><td>" + p.symbol + "</td><td>" + fmtN(p.qty,4) +
        "</td><td>$" + fmtN(p.avg_entry) + "</td><td>$" + fmtN(p.current_price) +
        "</td><td class='" + cls + "'>" + (v>=0?"+":"") + "$" + fmtN(v,2) + "</td></tr>";
    }).join("");
    $("haltMsg").textContent = d.halted ? ("HALTED: " + (d.halt_reason || "")) : "";
    const syms = Object.keys(d.bars || {});
    if (syms.length) {
      const pick = syms.find(s => d.trades && d.trades[s]) || syms[syms.length-1];
      currentSym = pick;
      bars = d.bars[pick] || [];
      trade = d.trades ? d.trades[pick] : null;
      $("focusSym").textContent = pick;
      drawCandles();
    }
    equityCurve = (d.equity_curve || []).map(x => x[1]);
    drawEquity();
    if (tab === 'log') {
      const logBox = $("logBox");
      logBox.innerHTML = (d.log || []).map(l =>
        "<div><span class='time'>[" + l.ts + "]</span><span class='" + l.level + "'>" + l.msg + "</span></div>"
      ).join("");
      logBox.scrollTop = logBox.scrollHeight;
    }
  } catch(e) { console.error(e); }
}
setInterval(tick, 2500); tick();

function drawCandles(){
  const c = $("candle"), ctx = c.getContext("2d");
  const W = c.width, H = c.height;
  ctx.clearRect(0,0,W,H);
  if (!bars || bars.length < 2) {
    ctx.fillStyle = "#8b949e"; ctx.font = "13px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("Ask Sentinel to analyze a symbol to load the chart", W/2, H/2);
    return;
  }
  const padL=12, padR=80, padT=26, padB=22;
  const pw = W-padL-padR, ph = H-padT-padB;
  let pmin = Math.min.apply(null, bars.map(b=>b.l));
  let pmax = Math.max.apply(null, bars.map(b=>b.h));
  if (trade) {
    pmin = Math.min(pmin, trade.sl, trade.tp);
    pmax = Math.max(pmax, trade.sl, trade.tp);
  }
  const ps = (pmax - pmin) || 1;
  const py = p => padT + ph*(1 - (p-pmin)/ps);

  ctx.strokeStyle = "#2a3142"; ctx.setLineDash([2,4]);
  ctx.fillStyle = "#8b949e"; ctx.font = "10px Consolas"; ctx.textAlign="left";
  for (let i=0;i<5;i++){
    const y = padT + ph*i/4;
    ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(padL+pw,y); ctx.stroke();
    ctx.fillText((pmax - ps*i/4).toFixed(2), W-72, y+3);
  }
  ctx.setLineDash([]);

  if (trade) {
    const ye = py(trade.entry), ys = py(trade.sl), yt = py(trade.tp);
    ctx.fillStyle = "rgba(63,185,80,0.10)";
    ctx.fillRect(padL, Math.min(ye,yt), pw, Math.abs(ye-yt));
    ctx.fillStyle = "rgba(248,81,73,0.10)";
    ctx.fillRect(padL, Math.min(ye,ys), pw, Math.abs(ye-ys));
    ctx.strokeStyle = "#3fb950"; ctx.setLineDash([5,3]);
    ctx.beginPath(); ctx.moveTo(padL,yt); ctx.lineTo(padL+pw,yt); ctx.stroke();
    ctx.strokeStyle = "#f85149";
    ctx.beginPath(); ctx.moveTo(padL,ys); ctx.lineTo(padL+pw,ys); ctx.stroke();
    ctx.strokeStyle = "#58a6ff"; ctx.setLineDash([]);
    ctx.beginPath(); ctx.moveTo(padL,ye); ctx.lineTo(padL+pw,ye); ctx.stroke();
    ctx.fillStyle = "#3fb950"; ctx.textAlign = "right";
    ctx.fillText("TP " + trade.tp.toFixed(4), W-6, yt+3);
    ctx.fillStyle = "#f85149";
    ctx.fillText("SL " + trade.sl.toFixed(4), W-6, ys+3);
    ctx.fillStyle = "#58a6ff";
    ctx.fillText("E " + trade.entry.toFixed(4), W-6, ye+3);
  }

  const n = bars.length, step = pw/n, bw = Math.max(4, step*0.45);
  bars.forEach(function(b,i){
    const cx = padL + step*(i+0.5);
    const up = b.c >= b.o, col = up ? "#3fb950" : "#f85149";
    ctx.strokeStyle = col;
    ctx.beginPath(); ctx.moveTo(cx,py(b.h)); ctx.lineTo(cx,py(b.l)); ctx.stroke();
    const yo = py(b.o), yc = py(b.c);
    const top = Math.min(yo,yc), bot = Math.max(yo,yc);
    ctx.fillStyle = col;
    ctx.fillRect(cx-bw/2, top, bw, Math.max(2, bot-top));
  });

  const last = bars[bars.length-1];
  ctx.fillStyle = "#e6edf3"; ctx.textAlign = "left";
  ctx.font = "600 12px Segoe UI";
  ctx.fillText(currentSym + "  -  " + n + " bars", padL+4, 14);
  const chg = ((last.c/bars[0].o-1)*100).toFixed(2);
  ctx.fillStyle = chg >= 0 ? "#3fb950" : "#f85149";
  ctx.fillText((chg>=0?"+":"") + chg + "%", padL+180, 14);
  const yl = py(last.c);
  ctx.strokeStyle = "#58a6ff"; ctx.setLineDash([3,3]);
  ctx.beginPath(); ctx.moveTo(padL,yl); ctx.lineTo(padL+pw,yl); ctx.stroke();
  ctx.setLineDash([]); ctx.fillStyle = "#58a6ff"; ctx.textAlign = "right";
  ctx.fillText(last.c.toFixed(4), W-6, yl+3);

  const ti = $("tradeInfo");
  if (trade) {
    const pl = (last.c - trade.entry) * trade.qty;
    ti.textContent = "ACTIVE " + trade.side + " " + trade.qty + " @ " +
      trade.entry.toFixed(4) + "  |  Now " + last.c.toFixed(4) +
      "  |  P/L $" + (pl>=0?"+":"") + pl.toFixed(2);
    ti.style.color = pl >= 0 ? "#3fb950" : "#f85149";
  } else {
    ti.textContent = "No active trade on " + currentSym;
    ti.style.color = "#8b949e";
  }
}

function drawEquity(){
  const c = $("equity"), ctx = c.getContext("2d");
  const W = c.width, H = c.height;
  ctx.clearRect(0,0,W,H);
  if (equityCurve.length < 2) {
    ctx.fillStyle = "#8b949e"; ctx.font = "11px sans-serif";
    ctx.textAlign = "center"; ctx.fillText("-", W/2, H/2);
    return;
  }
  const pad = 14, n = equityCurve.length;
  const mn = Math.min.apply(null, equityCurve);
  const mx = Math.max.apply(null, equityCurve);
  const span = (mx - mn) || 1;
  const pts = equityCurve.map(function(v,i){ return [
    pad + (W-2*pad)*i/(n-1),
    H-pad - (H-2*pad)*(v-mn)/span]; });
  ctx.strokeStyle = "#58a6ff"; ctx.lineWidth = 2;
  ctx.beginPath();
  pts.forEach(function(pt,i){ if(i) ctx.lineTo(pt[0],pt[1]); else ctx.moveTo(pt[0],pt[1]); });
  ctx.stroke();
  const lastpt = pts[pts.length-1];
  ctx.fillStyle = "#3fb950"; ctx.beginPath(); ctx.arc(lastpt[0],lastpt[1],3,0,7); ctx.fill();
  ctx.fillStyle = "#8b949e"; ctx.font = "10px Consolas"; ctx.textAlign = "left";
  ctx.fillText("$"+mx.toFixed(0), pad, 12);
  ctx.fillText("$"+mn.toFixed(0), pad, H-3);
}
</script>
</body>
</html>
